{% extends "core/kierownik/base.html" %}

{% block title %}Kierownik - Użytkownicy{% endblock %}
{% block header_title %}Masz X zgłoszeń{% endblock %}

{% block content %}
<section style="width: 100%; max-width: 820px; margin: 0 auto;">
    <div style="background: #cfd6de; padding: 24px; border-radius: 6px; display: flex; gap: 24px; align-items: flex-end;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="user-select" style="display: block; font-size: 13px; margin-bottom: 4px;">Username</label>
                <select id="user-select" style="width: 100%; padding: 10px; border: none; background: #fff; font-size: 14px;">
                    <option value="">-- Wybierz użytkownika --</option>
                    {% for user in uzytkownicy %}
                    <option value="{{ user.pk }}">{{ user }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="background: #b5b5b5; min-height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 15px;">
                Opis zgłoszeń (jeśli istnieją)
            </div>
        </div>

        <div style="width: 220px; display: flex; flex-direction: column; gap: 10px;">
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Awans na kierownika</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Awans na kasjera</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Usunięcie zgłoszeń</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Usunięcie konta</button>
        </div>
    </div>
</section>
{% endblock %}
