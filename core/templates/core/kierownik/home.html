{% extends "core/kierownik/base.html" %}

{% block title %}Wyciągi{% endblock %}
{% block header_title %}Masz {{ lifts|length }} wyciągów{% endblock %}

{% block content %}
<section class="tickets">
    {% for lift in lifts %}
    <article class="ticket">
        <div class="ticket-row">
            <span class="ticket-name">{{ lift.nazwa }}</span>
            <div class="ticket-fields">
                <span class="status-label">Stan</span>
                <button class="status active" type="button">{% if lift.czyczynny %}Aktywny{% else %}Nieczynny{% endif %}</button>
                <span class="level-label">Poziom</span>
                <button class="status level" type="button">{{ lift.wysokosc }} m</button>
            </div>
        </div>
        <div class="ticket-actions">
            <button class="action accept" type="button">Zaakceptuj</button>
            <button class="action reject" type="button">Odrzuć</button>
            <button class="action details" type="button">{{ lift.godzinaotwarcia|time:"H:i" }}–{{ lift.godzinazamkniecia|time:"H:i" }}</button>
        </div>
    </article>
    {% empty %}
    <article class="ticket empty-ticket">
        <strong>Brak wyciągów w bazie danych</strong>
    </article>
    {% endfor %}
</section>
{% endblock %}
