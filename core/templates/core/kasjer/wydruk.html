{% extends "core/kasjer/base.html" %}

{% block title %}Kasjer - Wydruk{% endblock %}
{% block header_title %}Masz X nowych wiadomości{% endblock %}

{% block content %}
<section style="width: 100%; max-width: 820px; margin: 0 auto;">
    <div style="background: #cfd6de; padding: 24px; border-radius: 6px; display: flex; gap: 24px; align-items: flex-end;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="wydruk-user" style="display: block; font-size: 13px; margin-bottom: 4px;">Username</label>
                <select id="wydruk-user" style="width: 100%; padding: 10px; border: none; background: #fff; font-size: 14px;">
                    <option value="">-- Wybierz użytkownika --</option>
                    {% for klient in klienci %}
                    <option value="{{ klient.pk }}">{{ klient }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="background: #b5b5b5; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 12px; font-size: 15px;">
                <span>Kalendarz (wybierz od - do historię do wydruku)</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="date" style="padding: 6px; border: none; border-radius: 4px;">
                    <span>–</span>
                    <input type="date" style="padding: 6px; border: none; border-radius: 4px;">
                </div>
            </div>
        </div>

        <div style="width: 200px; display: flex; flex-direction: column; gap: 10px;">
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Zapisz JPG</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Zapisz PNG</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Zapisz PDF</button>
            <button class="action accept" type="button" style="width: 100%; cursor: pointer;">Drukuj</button>
        </div>
    </div>
</section>
{% endblock %}
